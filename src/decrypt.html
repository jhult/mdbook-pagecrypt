 <!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Protected Page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.classless.min.css" />
</head>

<body>
    <noscript>
        This page requires JavaScript.
    </noscript>

    <dialog id="dialog">
        <article>
            <header>
                <p><strong id="msg">🗝️ This page is password protected.</strong></p>
            </header>
            <form id="form">
                <fieldset role="group">
                    <input type="password" id="pwd" name="pwd" aria-label="Password" placeholder="Password" autofocus />
                    <input type="submit" id="submit" value="Submit" />
                </fieldset>
            </form>

        </article>
    </dialog>

    <pre id="payload" data-r="{{ rounds }}" style="display: none;">data:;base64,{{ encrypted }}</pre>

    <script type="module">
        const subtle = window.crypto.subtle || window.crypto.webkitSubtle

        const dialog = document.getElementById('dialog')
        const hashedPassword = sessionStorage.hashedPassword
        // If we always open immediately, there will be a blink
        // on pages that will auto-decrypt. By checking if there
        // is a saved password first, we avoid the blink.
        if (!hashedPassword) {
            dialog.show()
        }
      
        const msg = document.getElementById('msg')
        const pwd = document.getElementById('pwd')

        const form = document.getElementById('form')
        form.addEventListener('submit', (e) => {
            e.preventDefault()
            decrypt()
        })

        document.addEventListener("DOMContentLoaded", async function () {
            if (!subtle) {
                msg.innerText = 'Your browser does not support Web Cryptography.'
                pwd.disabled = true
                dialog.show()
                return
            }

            // Allow passwords to be automatically provided via the URI Fragment.
            if (location.hash && location.hash.startsWith('#pwd=')) {
                const parts = location.href.split('#pwd=')
                pwd.value = parts[1]
                history.replaceState(null, '', parts[0])
            }

            // Attempt to decrypt with saved password
            if (hashedPassword) {
                try {
                    const payloadBundle = await fetchPayload()
                    if (!payloadBundle) {
                        msg.innerText = '❌ Invalid payload.'
                        console.error('Invalid payload')
                        dialog.show()
                        return
                    }
                    const { nonce, cipherText } = payloadBundle

                    const key = JSON.parse(hashedPassword)
                    const derivedKey = await subtle.importKey('jwk', key, { name: 'AES-GCM' }, true, ['decrypt'])
                    const decrypted = await subtle.decrypt({ name: 'AES-GCM', iv: nonce }, derivedKey, cipherText)
                    const decoded = new TextDecoder().decode(decrypted)
                    console.log("Decrypted with saved password")
                    finish(decoded, 0)
                } catch (e) {
                    console.error("Failed to decrypt with saved password", e)
                    sessionStorage.removeItem('hashedPassword')
                    msg.innerText = '🗝️ This page is password protected.'
                    dialog.show()
                }
            }
        })

        async function decrypt() {
            const submit = document.getElementById('submit')
            const payload = document.getElementById('payload')

            msg.innerText = 'Decrypting...'
            msg.ariaBusy = 'true'
            submit.disabled = true

            const password = pwd.value
            const rounds = parseInt(payload.dataset.r)
            if (!rounds) {
                msg.innerText = '❌ Invalid payload.'
                msg.ariaBusy = 'false'
                console.error('Invalid round count')
                return
            }

            const payloadBundle = await fetchPayload()
            if (!payloadBundle) {
                msg.innerText = '❌ Invalid payload.'
                msg.ariaBusy = 'false'
                console.error('Invalid payload')
                return
            }
            const { salt, nonce, cipherText } = payloadBundle

            const key = await subtle.importKey(
                'raw',
                new TextEncoder().encode(password),
                'PBKDF2',
                false,
                ['deriveKey']
            )
            const derivedKey = await subtle.deriveKey(
                { name: 'PBKDF2', salt, iterations: rounds, hash: 'SHA-256' },
                key,
                { name: 'AES-GCM', length: 256 },
                true,
                ['decrypt']
            )
            try {
                const decrypted = await subtle.decrypt(
                    { name: 'AES-GCM', iv: nonce },
                    derivedKey,
                    cipherText
                )
                const decoded = new TextDecoder().decode(decrypted)

                console.log("Decrypted with given password")
                sessionStorage.hashedPassword = JSON.stringify(await subtle.exportKey('jwk', derivedKey))

                finish(decoded, 500)
            } catch (e) {
                msg.innerText = '❌ Wrong password.'
                msg.ariaBusy = 'false'
                submit.disabled = false
                console.error('Wrong password', e)
                return
            }
        }

        async function fetchPayload() {
            const payload = document.getElementById('payload')

            const data = await fetch(payload.innerText)
            if (!data.ok) {
                return false
            }
            const encrypted = await data.arrayBuffer()
            const salt = encrypted.slice(0, 32)
            const nonce = encrypted.slice(32, 44)
            const cipherText = encrypted.slice(44)

            return { salt, nonce, cipherText }
        }

        function finish(decrypted, timeout) {
            const msg = document.getElementById('msg')
            msg.innerText = '✅ Decrypted.'
            msg.ariaBusy = 'false'
            setTimeout(function () {
                // Re-inject the password into the new document as an inline script.
                // document.write() clears sessionStorage in some browsers, so we
                // restore it immediately as the new document begins parsing.
                const persistScript = `<script>sessionStorage.hashedPassword=${JSON.stringify(sessionStorage.hashedPassword)}<\/script>`
                document.open()
                document.write(persistScript + decrypted)
                document.close()
            }, timeout || 0)
        }
    </script>

</body>

</html>
